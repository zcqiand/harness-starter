name: CI

# harness-starter（读者第一块 Harness 实验田：React 19 + Tailwind 4 + Vite + vitest，
# 书《Harness 工程》ch4-6 配套仓）
#
# test job：Node 24 单档跑 vitest + npm run build（tsc strict + vite）。
# deploy job 是 agent 家族部署链的 web-only 变体（docs/families/agent.md 游戏段，2026-11-19 起 5312）：
# tag push → 单镜像（-web）build & push → VPS deploy/harness-starter.sh
# 拉镜像 + 渲染 vhost（hstarter.xiangru.uk）+ 起容器 + web / 探活。
# 纯前端无后端：无 LLM_API_KEY、无 env-file、无 /api/。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node 24 + Vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (npm ci，npm 走 npmmirror)
        run: npm ci --registry=https://registry.npmmirror.com --no-audit --no-fund

      - name: Run vitest
        run: npm test

      - name: Build (tsc + vite，类型错误即红)
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-web:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-web:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env, with.envs 列出要转发的名字（逗号分隔）。
        # 本仓无 secret 依赖：仅转发可选 vhost 变量（缺省走脚本内置值）。
        env:
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（脚本 bug fix 立即生效）；nginx 模板由脚本自拉
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/main/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
            # 家族探活契约：web / 200（deploy 脚本内已 wget 探 120s，此处再显式断言一次）
            curl -fsS http://127.0.0.1:5312/ >/dev/null
