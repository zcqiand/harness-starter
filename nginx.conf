# harness-starter 容器内 nginx 静态服务配置（React SPA，Vite 产物哈希文件名）
# React 缓存形状（与 Godot 仓的纯 no-cache 区分）：assets 带指纹可长缓存，HTML 不缓存保证发版即生效。
# 非 WASM：无 COOP/COEP 头。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带指纹（vite 产物 assets/），可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
